<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CoffeeChat - Contacts</title>
  <link rel="stylesheet" href="css/contacts.css" />
</head>

<body>
  <header class="navbar">
    <div class="nav-left">
      <img src="images/coffeelogo.png" class="logo" alt="CoffeeChat Logo" />
      <h1>CoffeeChat</h1>
    </div>

    <nav class="nav-links">
      <a href="landing.html">Home</a>
      <a href="contacts.html">Contacts</a>
      <a href="#">About Us</a>
      <a href="login.html">Login</a>
  </nav>
  </header>

  <!-- Contacts Header -->
  <main class="container">

    <div class="top-bar">
      <h2>Your Coffee Contacts</h2>

      <div class="search-add">
        <input type="text" placeholder="Search contacts..." id="searchText" />
        <button class="search" id="searchBtn">Search</button>
        <button class="search" id="resetBtn">Reset</button>
        <button class="add-btn">+ Add Contact</button>
      </div>
    </div>

    <!-- Contact Grid -->
    <div class="card-grid" id="contactList"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">2026 CoffeeChat - Built for lasting connections</footer>

</body>

</html>

<script src="js/contacts.js"></script>
